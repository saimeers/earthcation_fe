# CI del panel: corre en cada PR y en cada push a develop/main. Vercel publica main, que solo recibe
# merges con este check en verde (protección de rama); los PR tienen su vista previa de Vercel.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read # gitleaks lee los commits del PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias y de componentes
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api-earthcation.saimers.dev
          VITE_PLAY_URL: https://play.earthcation.saimers.dev

      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Humo de los 3 paneles con la API simulada (respuestas grabadas en e2e/fixtures)
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas de humo (Playwright)
        run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
